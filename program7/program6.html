<head><title>program6</title></head>
<body>
<script>
document.write("<h2>Math Properties</h2>");
document.writeln("<br>Math.E"+Math.E);
document.writeln("<br>Math.PI"+Math.PI);
document.writeln("<br>Math.SQRT2:"+Math.SQRT2);
document.writeln("<br>Math.SQRT1_2"+Math.SQRT1_2);
document.writeln("<br>Math.LN2"+Math.LN2);
document.writeln("<br>Math.LN10"+Math.LN10);
document.writeln("<br>Math.LOG2E"+Math.LOG2E);
document.write("<br>Math.LOG10E"+Math.LOG10E);
document.write("<h2>Math Objects</h2>");
let n=7.52
document.write("<b>Number:7.52</br><br><br>");
document.write("<br>integer part:"+Math.trunc(n));
document.write("<br>nearest integer:"+Math.round(n));
document.write("<br>square root:"+Math.sqrt(n));
document.write("<br>minimum value from(4,3,7,-1):"+Math.min(4,3,7,-1));
document.write("<br>maximum value from(4,3,7,-1):"+Math.min(4,3,7,-1));
document.write("<h2>string methods</h2>");
let str="Muhammed mubrak";
document.write("<br>string:muhammed mubrak</b><br><br>");
document.writeln("length of string:"+str.length);
document.writeln("<br>string in upper case:"+str.toUpperCase());
document.writeln("<br>string in lower case:"+str.toLowerCase());
document.writeln("<br>join string:"+str.concat("","A P"));
document.writeln("<br>Replace muhammed in string:"+str.replace("MUhammed","Naham"));


</script>
